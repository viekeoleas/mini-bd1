[env:esp32dev]
; 7.1.3 (Arduino 2.x), как в jarvis-robot/audiokit: новые 3.x не распаковываются в Windows из-за длинных путей
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; без системных сообщений ядра: при плохом контакте I2C они сыпались сотнями и тормозили походку
build_flags = -DCORE_DEBUG_LEVEL=0
; PCA9685 управляется своим кодом в main.cpp (с проверкой записи и восстановлением шины), библиотеки не нужны
